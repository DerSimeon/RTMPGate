apiVersion: v1
kind: Service
metadata:
  name: {{ include "rtmpgate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rtmpgate.labels" . | nindent 4 }}
    app.kubernetes.io/component: http
  {{- with .Values.service.http.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.http.type }}
  selector:
    {{- include "rtmpgate.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.http.port }}
      targetPort: http
      protocol: TCP
