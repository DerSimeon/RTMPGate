name: Helm Publish

on:
  push:
    tags:
      - 'chart-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: helm-publish
  cancel-in-progress: false

env:
  CHART_DIR: deploy/helm/rtmpgate
  OCI_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  lint-and-publish:
    name: Lint, template, and publish chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Helm lint
        run: helm lint "${CHART_DIR}"

      - name: Set up kubeconform
        run: |
          set -euo pipefail
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/

      - name: Render and validate manifests
        run: |
          set -euo pipefail
          helm template rtmpgate "${CHART_DIR}" \
            --set secret.adminToken=test-token \
          | kubeconform -strict -summary \
              -ignore-missing-schemas \
              -kubernetes-version 1.29.0

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package chart
        id: package
        run: |
          set -euo pipefail
          helm package "${CHART_DIR}" --destination dist
          pkg="$(ls dist/*.tgz | head -n1)"
          echo "package=${pkg}" >> "$GITHUB_OUTPUT"

      - name: Push chart to GHCR
        run: helm push "${{ steps.package.outputs.package }}" "${OCI_REGISTRY}"
